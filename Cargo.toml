[workspace]
# Desktop GUI lives in https://github.com/EXboys/skilllite-assistant (not a workspace member).
members = ["skilllite", "crates/*"]
exclude = ["skilllite-assistant", "crates/skilllite-assistant", "crates/crates"]
resolver = "2"

[workspace.package]
version = "0.1.29"
edition = "2021"
authors = ["EX <boyex345@gmail.com>"]
license = "MIT"
repository = "https://github.com/EXboys/skilllite"
homepage = "https://github.com/EXboys/skilllite"
documentation = "https://docs.rs/skilllite"

[workspace.dependencies]
# Single thiserror major across the workspace (see spec/rust-conventions.md).
thiserror = "2.0.18"

[profile.release]
lto = true
strip = true
opt-level = "z"
